name: アプリを作る

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK はビルド用マシンに最初から入っている（ANDROID_HOME）
      - name: Android SDK の場所を確認
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties && ls "$ANDROID_HOME"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 署名鍵を復号
        env:
          NOKORI_KEY_PASSWORD: ${{ secrets.NOKORI_KEY_PASSWORD }}
        run: |
          if [ -z "$NOKORI_KEY_PASSWORD" ]; then
            echo "::error::Secrets に NOKORI_KEY_PASSWORD が登録されていません"
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/nokori.jks.enc -out app/nokori.jks -pass env:NOKORI_KEY_PASSWORD

      - name: ビルド
        env:
          NOKORI_KEY_PASSWORD: ${{ secrets.NOKORI_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: ファイル名をそろえる
        run: cp app/build/outputs/apk/release/app-release.apk nokori.apk

      - name: リリースに置く（スマホからダウンロードする場所）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 残り時間 1.0.${{ github.run_number }}
          files: nokori.apk
          make_latest: true
