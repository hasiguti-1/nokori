name: アプリを作る

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK はビルド用マシンに最初から入っている（ANDROID_HOME）
      - name: Android SDK の場所を確認
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties && ls "$ANDROID_HOME"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: 署名鍵を復号
        env:
          NOKORI_KEY_PASSWORD: ${{ secrets.NOKORI_KEY_PASSWORD }}
        run: |
          if [ -z "$NOKORI_KEY_PASSWORD" ]; then
            echo "::error::Secrets に NOKORI_KEY_PASSWORD が登録されていません"
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/nokori.jks.enc -out app/nokori.jks -pass env:NOKORI_KEY_PASSWORD

      - name: 単体テスト（残り時間の計算）
        run: |
          gradle testReleaseUnitTest --no-daemon --stacktrace
          # 結果の件数を画面上部の通知に出す（実行されたことを確かめられるように）
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for x in glob.glob("app/build/test-results/testReleaseUnitTest/*.xml"):
              r = ET.parse(x).getroot()
              t += int(r.get("tests")); f += int(r.get("failures")); e += int(r.get("errors")); s += int(r.get("skipped"))
          print(f"::notice title=単体テスト::{t}件実行、失敗{f}、エラー{e}、スキップ{s}")
          PY

      - name: ビルド
        env:
          NOKORI_KEY_PASSWORD: ${{ secrets.NOKORI_KEY_PASSWORD }}
        # apk はスマホに直接入れる用（Obtainium）、aab は Google Play に提出する用
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: ファイル名をそろえる
        run: |
          cp app/build/outputs/apk/release/app-release.apk nokori.apk
          cp app/build/outputs/bundle/release/app-release.aab nokori-play.aab

      - name: リリースに置く（スマホからダウンロードする場所）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 残り時間 1.0.${{ github.run_number }}
          files: |
            nokori.apk
            nokori-play.aab
          make_latest: true
