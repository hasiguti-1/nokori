name: アプリを作る

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: ビルド
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: ファイル名をそろえる
        run: cp app/build/outputs/apk/release/app-release.apk nokori.apk

      - name: リリースに置く（スマホからダウンロードする場所）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 残り時間 1.0.${{ github.run_number }}
          files: nokori.apk
          make_latest: true
